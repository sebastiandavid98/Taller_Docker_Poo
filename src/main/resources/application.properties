# Configuracion del servidor EcoAir
# El puerto donde escucha la aplicacion
server.port=8080

# Nombre de la aplicacion (aparece en los logs)
spring.application.name=eco-air-backend

# Actuator: habilitamos el endpoint /actuator/health
# Esto sirve para verificar que la app esta viva dentro del contenedor
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Info del proyecto (aparece en /actuator/info)
info.app.name=EcoAir Backend
info.app.version=1.0.0
info.app.estudiante=908407
